name: Daily Training Pipeline

on:
  schedule:
    - cron: "30 0 * * *"        # daily at 00:30 UTC (after the hourly feature runs)
  workflow_dispatch:

concurrency:
  group: training-pipeline
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt

      # Restore features from Hopsworks (+ latest hour) so training has data on the fresh runner
      - name: Refresh features from Hopsworks
        run: python -m src.automation.hourly_feature_pipeline

      # Retrain → evaluate → promote → forecast → monitor → upload to model registry
      - name: Run daily training pipeline
        run: python -m src.automation.daily_training_pipeline
