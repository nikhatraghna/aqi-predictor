name: Daily Training Pipeline

on:
  # schedule:
  #   - cron: "30 0 * * *"     # daily 00:30 UTC — uncomment to run on a schedule
  workflow_dispatch:

concurrency:
  group: training-pipeline
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    env:                                   # job-level → every step sees the creds
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt

      # Restore the feature dataset from the Hopsworks feature store (and append the
      # latest hour) so the training scripts have data on this fresh runner.
      - name: Refresh features from Hopsworks
        run: python -m src.automation.hourly_feature_pipeline

      # Retrain → evaluate → promote → forecast → monitor → upload to model registry.
      - name: Run daily training pipeline
        run: python -m src.automation.daily_training_pipeline
