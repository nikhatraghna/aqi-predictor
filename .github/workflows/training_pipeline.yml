name: Daily Training Pipeline

on:
  schedule:
    - cron: "30 0 * * *"        # daily at 00:30 UTC (after features are fresh)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: training-pipeline
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily training pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: python -m src.automation.daily_training_pipeline
      - name: Commit refreshed artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ reports/ data/processed/forecast_3days.parquet
          git diff --staged --quiet || git commit -m "chore(models): daily retrain + refresh [skip ci]"
          git push
