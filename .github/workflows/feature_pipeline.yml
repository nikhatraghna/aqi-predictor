name: Hourly Feature Pipeline

on:
  schedule:
    - cron: "0 * * * *"        # every hour (UTC)
  workflow_dispatch:            # allow manual runs

permissions:
  contents: write               # needed to commit artifacts back

concurrency:
  group: feature-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run hourly feature pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: python -m src.automation.hourly_feature_pipeline
      - name: Commit updated features
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/islamabad_features.parquet
          git diff --staged --quiet || git commit -m "chore(data): hourly feature update [skip ci]"
          git push
